[workspace]
members = ["crates/parfait-core", "crates/parfait-storage", "apps/parfait"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/oRE-o/Parfait"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
parfait-core = { path = "crates/parfait-core" }
parfait-storage = { path = "crates/parfait-storage" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
