[package]
name = "parfait"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "parfait"

[dependencies]
parfait-core.workspace = true
parfait-storage.workspace = true
anyhow.workspace = true
getrandom = "0.3"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17"
serde.workspace = true
serde_json = "1"

[dev-dependencies]
tempfile = "3"
